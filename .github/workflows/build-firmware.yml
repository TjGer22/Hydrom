name: Build Firmware

on:
  push:
    branches: [main, develop]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "firmware/**"

jobs:
  # ──────────────────────────────────────────────
  # 1. Build the firmware and filesystem image
  # ──────────────────────────────────────────────
  build:
    name: Build Firmware & SPIFFS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('firmware/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build SPIFFS filesystem image
        working-directory: firmware
        run: pio run --target buildfs --environment local

      - name: Build firmware
        working-directory: firmware
        run: pio run --environment local

      - name: Upload firmware artefacts
        uses: actions/upload-artifact@v4
        with:
          name: hydrom-firmware-${{ github.sha }}
          path: |
            firmware/.pio/build/local/firmware.bin
            firmware/.pio/build/local/partitions.bin
            firmware/.pio/build/local/spiffs.bin
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Static code analysis
  # ──────────────────────────────────────────────
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Run PlatformIO check (high severity only)
        working-directory: firmware
        run: pio check --severity=high --skip-packages --environment local
