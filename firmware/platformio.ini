; ─── PlatformIO Project Configuration ────────────────────────────────────────
; Documentation: https://docs.platformio.org/en/latest/projectconf/index.html
;
; Target board: Heltec WiFi LoRa 32 V2 (ESP32, 8 MB Flash)
;
; NOTE: platform-espressif32 is pinned to 3.5.0.
;   Versions 4.x have a known I2C regression on this board.
;   See: https://github.com/platformio/platform-espressif32/issues/786

[platformio]
default_envs = local

; ─── Shared settings for all environments ─────────────────────────────────────
[env]
platform                   = espressif32@3.5.0
board                      = heltec_wifi_lora_32_V2
framework                  = arduino
board_upload.flash_size    = 8MB
board_upload.maximum_size  = 8388608
board_build.partitions     = partitions_custom8MB.csv
monitor_speed              = 115200

; ─── Default build (pinned library versions for reproducible builds) ──────────
[env:local]
lib_deps =
    bblanchon/ArduinoJson@6.19.3
    links2004/WebSockets@2.3.6
    knolleary/PubSubClient@^2.8.0
    rotario/CurveFitting@^1.0.6
    paulstoffregen/OneWire@^2.3.6
    pfeerick/elapsedMillis@^1.0.6
    madhephaestus/ESP32AnalogRead@^0.3.0
    marian-craciunescu/ESP32Ping@^1.7
    witnessmenow/UniversalTelegramBot@^1.3.0

; ─── Up-to-date build (latest compatible versions) ────────────────────────────
[env:local_uptodate]
lib_deps =
    bblanchon/ArduinoJson@^6.19.4
    links2004/WebSockets@^2.3.7
    knolleary/PubSubClient@^2.8.0
    rotario/CurveFitting@^1.0.6
    paulstoffregen/OneWire@^2.3.6
    pfeerick/elapsedMillis@^1.0.6
    madhephaestus/ESP32AnalogRead@^0.3.0
    marian-craciunescu/ESP32Ping@^1.7

; ─── Debug build (adds exception decoder and verbose logging) ─────────────────
[env:debug]
lib_deps =
    bblanchon/ArduinoJson@6.19.3
    links2004/WebSockets@2.3.6
    knolleary/PubSubClient@^2.8.0
    rotario/CurveFitting@^1.0.6
    paulstoffregen/OneWire@^2.3.6
    pfeerick/elapsedMillis@^1.0.6
    madhephaestus/ESP32AnalogRead@^0.1.2
    marian-craciunescu/ESP32Ping@^1.7
    witnessmenow/UniversalTelegramBot@^1.3.0
monitor_filters = log2file, debug, esp32_exception_decoder
